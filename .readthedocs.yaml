# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# HTML only. PDF/ePub would re-run Sphinx and eat the 15-minute
# community timeout that Sphinx-Gallery already needs for examples.
formats: []

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.10"
  jobs:
    pre_build:
      # Rolling GitHub Release asset (not in git). Matching .md5 files let
      # Sphinx-Gallery skip unchanged examples.
      - |
        if curl -fL --retry 3 -o /tmp/auto_examples.tar.gz \
          "https://github.com/wwhenxuan/PySDKit/releases/download/gallery-cache/auto_examples.tar.gz"; then
          tar -xzf /tmp/auto_examples.tar.gz
        else
          echo "No gallery-cache release yet; Sphinx-Gallery will run from scratch."
        fi

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt
